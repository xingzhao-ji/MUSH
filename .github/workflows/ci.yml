name: Headless source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-source:
    name: Runner receipts and Godot startup (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify receipt failure paths
        run: python -m unittest discover -s tests -p test_verify_runner.py -v
      - name: Install the qualified official Godot build
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/mush-ci-data" >> "$GITHUB_ENV"
      - name: Import the clean source with preservation checks
        run: python tools/verify.py --engine "$GODOT" --suite import
      - name: Verify headless flower, forest and paving-shape authoring
        shell: bash
        run: |
          set -euo pipefail
          for suite in flower-build forest-build shape-build; do
            python tools/verify.py --engine "$GODOT" --suite "$suite"
          done
      - name: Exercise real scene startup, motion, pause, night and rain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci-smoke
          timeout 180 "$GODOT" --headless --path . --audio-driver Dummy -- \
            --smoke --exercise-effects --report-dir "$PWD/reports/ci-smoke" \
            2>&1 | tee reports/ci-smoke/engine.log
          python - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path("reports/ci-smoke")
          report = json.loads((root / "smoke.json").read_text())
          assert report["schema"] == "mush-current-playable-smoke/1"
          assert report["passed"] is True
          assert report["engine"] == "4.7.2-stable (official)"
          assert len(report["checks"]) >= 12
          assert all(value is True for value in report["checks"].values())
          log = (root / "engine.log").read_text()
          assert not re.search(r"^(?:SCRIPT ERROR|ERROR):", log, flags=re.MULTILINE), log
          print(f"Passed {len(report['checks'])} headless scene checks.")
          PY
      - name: Check tracked source preservation
        run: git diff --exit-code
      - name: Record the exact coverage boundary
        if: always()
        run: |
          {
            echo "## Headless source CI"
            echo "This job gates receipt unit tests, clean import, three headless geometry-build suites, and 12 real-scene startup/effects checks."
            echo "It does not qualify full gameplay, rendering, performance, exports, audio listening, or devices."
            echo "The separately documented paving contact-coverage failure remains unresolved and is not waived."
            echo "See docs/CI.md and docs/VERIFICATION.md."
          } >> "$GITHUB_STEP_SUMMARY"
