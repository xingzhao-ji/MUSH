[preset.0]
name="macOS MUSH"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/licenses/*,assets/credits.json,assets/world/*.json,lineage/**/*.json,baked/*.res,baked/*.json"
exclude_filter="review/*,reports/*,tools/*,builds/*,assets/generate_audio.py,tests/test_*"
export_path="builds/MUSH.zip"
script_export_mode=0

[preset.0.options]
custom_template/debug=""
custom_template/release=""
export/distribution_type=1
binary_format/architecture="universal"
application/bundle_identifier="local.mush.clearing.dev"
application/signature="MUSH"
application/icon="res://assets/icon.svg"
application/app_category="games"
application/short_version="0.6.0"
application/version="0.6.0"
application/copyright="MUSH prototype. Music: Reverie by Scott Buckley, CC BY 4.0. Footsteps: Kenney, CC0. Godot Engine MIT."
application/modify_resources=true
codesign/codesign=1
codesign/identity="-"
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

application/min_macos_version_arm64="14.00"

shader_baker/enabled=true
